<!DOCTYPE html>
<html>
<head>
    <title>Register | ML Analytics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617, #7c3aed);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h2 { text-align: center; margin-bottom: 10px; color: #111827; }
        p { text-align: center; color: #6b7280; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #6d28d9; }

        .link {
            margin-top: 18px;
            text-align: center;
        }

        .link a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: bold;
        }

        .msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Create Account</h2>
    <p>Start using ML Analytics</p>

    {% for message in messages %}
        <div class="msg">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email address" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm password" required>
        <button type="submit">Register</button>
    </form>

    <div class="link">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
</div>

</body>
</html>
