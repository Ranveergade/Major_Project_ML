<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Dataset - ML Analytics Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f23 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }
        
        .gradient-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 16px 36px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        
        .drop-zone i {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .text-white-50 {
            color: rgba(255, 255, 255, 0.7) !important;
        }
        
        .file-info-card {
            background: rgba(102, 126, 234, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .navbar-custom {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="text-white">
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="/">
                <i class="fas fa-brain text-primary me-2"></i>ML Analytics Pro
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="/">Home</a>
                <a class="nav-link text-white" href="/ml/">Upload</a>
                <a class="nav-link text-white" href="/dashboard/">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card p-5">
                    <h2 class="text-center mb-4">
                        <i class="fas fa-cloud-upload-alt me-2"></i>Upload Dataset
                    </h2>
                    <p class="text-center text-white-50 mb-4">
                        Upload your dataset to start Automatic ML Analysis
                    </p>

                    <div class="drop-zone" id="dropZone">
                        <i class="fas fa-cloud-upload-alt mb-3"></i>
                        <h4>Drag & Drop your file here</h4>
                        <p class="text-white-50 mb-3">or click to browse</p>
                        <p class="text-white-50 small">
                            Supported: <strong>CSV, Excel (.xlsx), JSON</strong>
                        </p>
                        <input type="file" id="fileInput" accept=".csv,.xlsx,.json,.xls" hidden>
                    </div>

                    <div id="fileInfo" class="file-info-card d-none">
                        <h5><i class="fas fa-file me-2"></i><span id="fileName"></span></h5>
                        <div class="row mt-3">
                            <div class="col-4">
                                <p class="mb-1 small text-white-50">Rows</p>
                                <h4 id="rowCount">-</h4>
                            </div>
                            <div class="col-4">
                                <p class="mb-1 small text-white-50">Columns</p>
                                <h4 id="colCount">-</h4>
                            </div>
                            <div class="col-4">
                                <p class="mb-1 small text-white-50">Size</p>
                                <h4 id="fileSize">-</h4>
                            </div>
                        </div>
                        <div class="mt-3">
                            <p class="mb-1 small text-white-50">Columns:</p>
                            <p id="columnsList" class="small"></p>
                        </div>
                    </div>

                    <div id="errorMsg" class="alert alert-danger d-none mt-3"></div>

                    <button id="analyzeBtn" class="btn gradient-btn btn-lg w-100 mt-4" disabled>
                        <i class="fas fa-rocket me-2"></i>Start ML Analysis
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const errorMsg = document.getElementById('errorMsg');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        async function handleFile(file) {
            if (!file) return;

            selectedFile = file;
            errorMsg.classList.add('d-none');

            const ext = file.name.split('.').pop().toLowerCase();
            const allowedExts = ['csv', 'xlsx', 'json', 'xls'];

            if (!allowedExts.includes(ext)) {
                errorMsg.classList.remove('d-none');
                errorMsg.textContent = 'Invalid file type! Please upload CSV, Excel, or JSON file.';
                return;
            }

            // Show file info
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(2) + ' KB';

            // Send to server to get details
            const formData = new FormData();
            formData.append('file', file);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            try {
                const response = await fetch('/ml/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('rowCount').textContent = data.rows;
                    document.getElementById('colCount').textContent = data.columns.length;
                    document.getElementById('columnsList').textContent = data.columns.join(', ');
                    fileInfo.classList.remove('d-none');
                    analyzeBtn.disabled = false;
                } else {
                    errorMsg.classList.remove('d-none');
                    errorMsg.textContent = data.error || 'Error reading file';
                }
            } catch (err) {
                errorMsg.classList.remove('d-none');
                errorMsg.textContent = 'Error uploading file. Please try again.';
            }
        }

        analyzeBtn.addEventListener('click', () => {
            if (selectedFile) {
                alert('ML Analysis would start here! (Backend coming soon)');
            }
        });
    </script>
</body>

</html>
